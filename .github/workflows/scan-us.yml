name: Mint US Scan (NASDAQ)

# 평일 NY 정규장 = KST 22:30~익일 05:00 (DST: UTC 13:30~20:00 / 비DST: 14:30~21:00).
# 둘 다 커버하려면 UTC 13-21 (10분 간격). cron 요일은 UTC 기준 월~금.
#
# 2026-05-27 활성화: Stage 2 NASDAQ 모델 학습 완료 (mint_lgbm_us.joblib).
#   - 라벨: 24h +2%/-2% (KR 24h +3%/-2%과 다름. 사용자 (B) 결정, 5/26).
#   - Val AUC 0.553, 임계값 0.55에서 precision 0.636·일평균 0.22건.
#   - KR 동급 (precision 0.79) 미달이나 운영 outcome 누적 후 재학습 전제로 시작.
on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'   # NY 정규장 cover (DST/비DST 모두)
  workflow_dispatch: {}

concurrency:
  group: mint-us-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan US
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          # Stage 2 학습 완료 — ML 활성화. NASDAQ 모델 confidence p99=0.556이라
          # 임계값 0.55가 실 운영선 (0.60 이상은 사실상 0건). KR 0.60과 다름.
          MINT_USE_ML_CONFIDENCE:    'true'
          MINT_USE_MINUTE_RULE:      'false'   # Alpaca 도입 (Stage 2.5) 전 OFF
          MINT_MIN_ML_CONFIDENCE:    '0.55'
          MINT_WATCHLIST_SIZE:       '300'    # NASDAQ-100 + S&P NASDAQ 합쳐 ~171
          MINT_MAX_RISK_SCORE:       '45'
          MINT_US_SCAN:              'true'
        run: python -X utf8 mint/main.py scan-us
