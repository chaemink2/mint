name: Mint US Scan (NASDAQ)

# 평일 NY 정규장 = KST 22:30~익일 05:00 (DST: UTC 13:30~20:00 / 비DST: 14:30~21:00).
# 둘 다 커버하려면 UTC 13-21 (10분 간격). cron 요일은 UTC 기준 월~금.
#
# 활성화 정책 (2026-05-26):
#   Stage 1 (인프라 완비) 단계는 schedule **비활성** 유지. NASDAQ 전용 ML 모델이
#   아직 없어 룰만으로 시그널 발급 시 KR과 동급 신뢰도 미달.
#   Stage 2 (mint_lgbm_us.joblib 학습) 완료 후 schedule 주석 해제 commit으로 활성화.
#   현재는 workflow_dispatch (수동) 만으로 인프라 시범 동작 검증 가능.
on:
  # schedule:
  #   - cron: '*/10 13-21 * * 1-5'   # NY 정규장 cover (DST/비DST 모두)
  workflow_dispatch: {}

concurrency:
  group: mint-us-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan US
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          # Stage 1: NASDAQ ML 모델 아직 학습 안 됨 → ML/분봉 OFF로 룰만 동작.
          # Stage 2 (mint_lgbm_us.joblib) 완료 후 'true' + 임계값 0.60으로 전환.
          MINT_USE_ML_CONFIDENCE:    'false'
          MINT_USE_MINUTE_RULE:      'false'
          MINT_MIN_ML_CONFIDENCE:    '0.60'
          MINT_WATCHLIST_SIZE:       '200'   # universe.py가 NASDAQ은 100으로 cap
          MINT_MAX_RISK_SCORE:       '45'
          MINT_US_SCAN:              'true'
        run: python -X utf8 mint/main.py scan-us
