name: Mint US Scan (NASDAQ)

# 평일 KST 22:30~익일 05:00 (UTC 13:30~20:00), 10분 간격
# 활성화: 사용자가 NASDAQ 야간 운영 원할 때만. 기본은 schedule trigger 비활성(주석).
# workflow_dispatch로 수동 실행 가능.
on:
  # schedule:
  #   - cron: '*/10 13-19 * * 1-5'   # UTC 13:30~19:50 (KST 22:30~04:50, NY 정규장)
  workflow_dispatch: {}

concurrency:
  group: mint-us-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan US
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          MINT_USE_ML_CONFIDENCE: 'true'
          MINT_MIN_ML_CONFIDENCE: '0.60'
          MINT_US_SCAN:           'true'
        run: python -X utf8 mint/main.py scan-us
