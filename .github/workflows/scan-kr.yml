name: Mint KR Scan

# 평일 KST 09:00~15:50 (UTC 00:00~06:50)
# 2026-06-02: 5개 slot 분산 — 매 시간 5회 trigger 시도.
# 이전: 3 slot (13/33/47) → 5 slot (7/19/31/43/55).
# GHA 부하 회피 + 12분 간격으로 더 촘촘. 일부 누락해도 매시 2~3회 success 기대.
on:
  schedule:
    - cron: '7 0-6 * * 1-5'
    - cron: '19 0-6 * * 1-5'
    - cron: '31 0-6 * * 1-5'
    - cron: '43 0-6 * * 1-5'
    - cron: '55 0-6 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: mint-kr-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-06-09 P0 롤백: minute_first OFF 후 600종목 일봉+ML+분봉 AND 모드.
    # 6/3 첫 success run (universe fetch 포함, minute_first=true 환경) 15분 완료 — 20분 안전 마진.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan KR
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          KIS_APP_KEY:          ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:       ${{ secrets.KIS_APP_SECRET }}
          MINT_USE_ML_CONFIDENCE:    'true'
          MINT_USE_MINUTE_RULE:      'true'
          # 2026-06-16 N2: 0.60 → 0.70. 6월 실 ML score 95%가 1.0 saturate라
          # 임계값 자체 영향 미미하지만 안전 마진.
          MINT_MIN_ML_CONFIDENCE:    '0.70'
          # 2026-06-16 N3+ A: exp_return 12% cap. 15%+ 47건이 6월 거의 전멸 (mean reversion).
          MINT_MAX_EXPECTED_RETURN:  '0.12'
          # 2026-06-16 N3+ B: dedup 4h → 24h. 반복 발급 폭주 차단
          # (STRONG_BULL 86건 중 같은 종목 76% 반복, 매번 LOSS).
          MINT_SIGNAL_DEDUP_H:       '24'
          # 2026-06-16 N3+ C: dynamic exit OFF — target/stop이 학습 라벨과 mismatch였음
          # (운영 target median +10.4% vs 학습 +3%). fixed +3%/-2%/24h 환원.
          MINT_USE_DYNAMIC_EXIT:     'false'
          MINT_MIN_MINUTE_VOL_SPIKE: '2.0'
          # 2026-06-09: 600 유지 (사용자 의향 — 소형주 catch율 우선).
          # 600 자체는 timeout 원인 아님 (6/3 첫 success 15분 완료). 진짜 원인은 minute_first.
          MINT_WATCHLIST_SIZE:       '600'
          MINT_MAX_RISK_SCORE:       '45'
          # 2026-06-16: 30 → 5 환원. 6/1 28f36a6 사용자 미합의 변경 픽스.
          MINT_MAX_DAILY_BUYS:       '5'
          # 2026-06-09 P0 롤백: 분봉 1차 발견 OFF. be07ac5 운영 권장 자체가
          # "1주 OFF로 600 효과 관찰 후 활성화"였음 — 이걸 즉시 켜서 timeout 발생.
          # 일봉+ML 통과 종목에 분봉 AND 필터 (MINT_USE_MINUTE_RULE)는 유지.
          MINT_MINUTE_FIRST:         'false'
        run: python -X utf8 mint/main.py scan
