name: Mint KR Scan

# 평일 KST 09:00~15:50 (UTC 00:00~06:50)
# 2026-06-01: 기존 `*/10 0-6 * * 1-5` → 정시/30분 슬롯 2개로 분리.
# 이전 패턴은 GHA 부하 정책상 하루 2~3회만 실행됨 (5/22~5/29 실측 기준).
# 정시/30분 슬롯은 GHA가 더 잘 트리거 (다른 워크플로와 충돌 적은 시각).
on:
  schedule:
    - cron: '0 0-6 * * 1-5'    # KST 매 정시 09~15시
    - cron: '30 0-6 * * 1-5'   # KST 매 30분 09:30~15:30
  workflow_dispatch: {}

concurrency:
  group: mint-kr-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan KR
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          KIS_APP_KEY:          ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:       ${{ secrets.KIS_APP_SECRET }}
          MINT_USE_ML_CONFIDENCE:    'true'
          MINT_USE_MINUTE_RULE:      'true'
          MINT_MIN_ML_CONFIDENCE:    '0.60'
          MINT_MIN_MINUTE_VOL_SPIKE: '2.0'
          # 2026-06-01: 200 → 600 (소형주 상한가 catch율 개선).
          # 캐시 24h라 첫날만 fetch 시간 증가, 이후엔 OHLCV만 ~10분 소요.
          MINT_WATCHLIST_SIZE:       '600'
          MINT_MAX_RISK_SCORE:       '45'
          MINT_MAX_DAILY_BUYS:       '30'
        run: python -X utf8 mint/main.py scan
