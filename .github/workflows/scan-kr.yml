name: Mint KR Scan

# 평일 KST 09:00~15:50 (UTC 00:00~06:50)
# 2026-06-02: 정시/30분 슬롯도 6/2 09~12시 KST 모두 누락됨 (GHA 부하).
# → 흔치 않은 분(13/33/47)으로 분산. 다른 워크플로와 시각 충돌 ↓.
# 하루 6h × 3 slot = 18회 trigger 시도. 일부 누락해도 충분.
on:
  schedule:
    - cron: '13 0-6 * * 1-5'
    - cron: '33 0-6 * * 1-5'
    - cron: '47 0-6 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: mint-kr-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan KR
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          KIS_APP_KEY:          ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:       ${{ secrets.KIS_APP_SECRET }}
          MINT_USE_ML_CONFIDENCE:    'true'
          MINT_USE_MINUTE_RULE:      'true'
          MINT_MIN_ML_CONFIDENCE:    '0.60'
          MINT_MIN_MINUTE_VOL_SPIKE: '2.0'
          # 2026-06-01: 200 → 600 (소형주 상한가 catch율 개선).
          # 캐시 24h라 첫날만 fetch 시간 증가, 이후엔 OHLCV만 ~10분 소요.
          MINT_WATCHLIST_SIZE:       '600'
          MINT_MAX_RISK_SCORE:       '45'
          MINT_MAX_DAILY_BUYS:       '30'
          # 2026-06-01: 분봉 1차 발견 모드 활성화 (사용자 결정 — 즉시 검증).
          # 600종목 KIS 분봉 fetch → 3~10분/cron. 강한 패턴(spike2.5+breakout+
          # accel+양봉)만 후보 → 일봉 risk + ML 보조 검증. 실패 시 env 라인 제거로 롤백.
          MINT_MINUTE_FIRST:         'true'
        run: python -X utf8 mint/main.py scan
