name: Mint KR Scan

# 평일 KST 09:00~15:50 (UTC 00:00~06:50)
# 2026-06-02: 5개 slot 분산 — 매 시간 5회 trigger 시도.
# 이전: 3 slot (13/33/47) → 5 slot (7/19/31/43/55).
# GHA 부하 회피 + 12분 간격으로 더 촘촘. 일부 누락해도 매시 2~3회 success 기대.
on:
  schedule:
    - cron: '7 0-6 * * 1-5'
    - cron: '19 0-6 * * 1-5'
    - cron: '31 0-6 * * 1-5'
    - cron: '43 0-6 * * 1-5'
    - cron: '55 0-6 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: mint-kr-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-06-09 P0 롤백: 600+minute_first OFF 후 200종목 일봉/분봉 AND 모드 — 15분 충분.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Scan KR
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI:   ${{ secrets.KAKAO_REDIRECT_URI }}
          KIS_APP_KEY:          ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:       ${{ secrets.KIS_APP_SECRET }}
          MINT_USE_ML_CONFIDENCE:    'true'
          MINT_USE_MINUTE_RULE:      'true'
          MINT_MIN_ML_CONFIDENCE:    '0.60'
          MINT_MIN_MINUTE_VOL_SPIKE: '2.0'
          # 2026-06-09 P0 롤백: 600 → 200. 600+분봉1차 결합이 25분 timeout 초과해
          # 6/4~6/9 4영업일 100% cancel. 28f36a6의 today_count 시장별 카운팅 픽스는 유지.
          MINT_WATCHLIST_SIZE:       '200'
          MINT_MAX_RISK_SCORE:       '45'
          MINT_MAX_DAILY_BUYS:       '30'
          # 2026-06-09 P0 롤백: 분봉 1차 발견 OFF. be07ac5 운영 권장 자체가
          # "1주 OFF로 600 효과 관찰 후 활성화"였음 — 이걸 즉시 켜서 timeout 발생.
          # 일봉+ML 통과 종목에 분봉 AND 필터 (MINT_USE_MINUTE_RULE)는 유지.
          MINT_MINUTE_FIRST:         'false'
        run: python -X utf8 mint/main.py scan
