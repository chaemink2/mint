name: Mint Daily Summary

# 평일 KST 15:35 (UTC 06:35). KR 장 마감 후 outcome 평가 + 일일 요약 카톡.
on:
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: mint-daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'mint/requirements-runtime.txt'

      - name: Install deps
        run: pip install -r mint/requirements-runtime.txt

      - name: Daily Summary
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
        run: python -X utf8 mint/main.py daily-summary
